# ============================================================
#  🔢 MATH's ROCK's SUITE — Suite Matemática Local con Docker
# ============================================================

networks:
  mathnet:
    driver: bridge

volumes:
  jupyter_data:

services:
  # ─────────────────────────────────────────────
  # 1. JupyterLab Científico (Python + Julia + R)
  # ─────────────────────────────────────────────
  jupyterlab:
    build:
      context: ./docker/jupyterlab
    container_name: maths-rocks-jupyterlab
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=maths-rocks-2026
      - GRANT_SUDO=yes
    volumes:      
      - jupyter_data:/home/jovyan/work
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data:/home/jovyan/work/data
      - ./config/jupyterlab/jupyter_lab_config.py:/home/jovyan/.jupyter/jupyter_lab_config.py
    networks:
      - mathnet

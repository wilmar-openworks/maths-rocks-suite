# ============================================================
#  🔢 MATH's ROCK's SUITE — Suite Matemática Local con Docker
# ============================================================
# Herramientas incluidas:
#   1. JupyterLab          → Entorno principal (Python + Julia + R)
#   2. SageMath            → Matemáticas avanzadas (Álgebra, Geometría, Teoría de Números)
#   3. GNU Octave          → Alternativa libre a MATLAB
# ============================================================

networks:
  mathnet:
    driver: bridge

volumes:
  jupyter_data:
  sage_data:
  octave_data:

services:
  # ─────────────────────────────────────────────
  # 1. JupyterLab Científico (Python + Julia + R)
  # ─────────────────────────────────────────────
  jupyterlab:
    build:
      context: ./docker/jupyterlab
    container_name: maths-rocks-jupyterlab
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=maths-rocks-2026
      - GRANT_SUDO=yes
    volumes:
      - jupyter_data:/home/jovyan/work
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data:/home/jovyan/work/data
      - ./config/jupyterlab/jupyter_lab_config.py:/home/jovyan/.jupyter/jupyter_lab_config.py
    networks:
      - mathnet

  # ─────────────────────────────────────────────
  # 2. SageMath — CAS Matemático Completo
  # ─────────────────────────────────────────────
  sagemath:
    build:
      context: ./docker/sagemath      
    container_name: maths-rocks-sagemath
    restart: unless-stopped
    ports:
      - "8890:8888"
    volumes:
      - sage_data:/home/sage
      - ./notebooks/sage-notebooks:/home/sage/notebooks
      - ./data/sage-data:/home/sage/data
    networks:
      - mathnet
    command: >
      sage -n jupyterlab 
           --ip=0.0.0.0 
           --port=8888 
           --no-browser 
           --NotebookApp.token=maths-rocks-2026 
           --notebook-dir=/home/sage/notebooks

  # ─────────────────────────────────────────────
  # 3. GNU Octave — Computación Numérica (MATLAB libre)
  # ─────────────────────────────────────────────
  octave:
    build:
      context: ./docker/octave
      dockerfile: Dockerfile
    container_name: maths-rocks-octave
    restart: unless-stopped
    ports:
      - "8890:8888"   # 8890 host → 8888 contenedor
    networks:
      - mathnet
    volumes:
      - octave_data:/root/octave
      - ./notebooks/octave-notebooks:/root/octave/notebooks
      - ./data/octave-data:/root/octave/data
